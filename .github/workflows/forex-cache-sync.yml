name: Refresh forex cache

on:
  workflow_dispatch:
  schedule:
    - cron: "* * * * *"  # Every 1 minute

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Firebase forex cache
        run: |
          set +e
          failures=0
          auth_header="Authorization: Bearer ${{ secrets.CRON_SECRET }}"

          echo "Refreshing Forex cache..."
          curl --fail-with-body --retry 2 --silent --show-error \
            -H "$auth_header" "https://www.tradivex.com/api/forex/sync"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Forex cache refresh failed with exit code ${status}."
            failures=$((failures + 1))
          fi

          if [ "$failures" -gt 0 ]; then
            echo "${failures} forex cache refresh job(s) failed."
            exit 1
          fi