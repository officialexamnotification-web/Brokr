name: Refresh market cache

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"  # Crypto every 5 minutes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Firebase market snapshots
        run: |
          set +e
          failures=0
          auth_header="Authorization: Bearer ${{ secrets.CRON_SECRET }}"

          refresh() {
            label="$1"
            url="$2"
            echo "Refreshing ${label} cache..."
            curl --fail-with-body --retry 2 --silent --show-error \
              -H "$auth_header" "$url"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "${label} cache refresh failed with exit code ${status}."
              failures=$((failures + 1))
            fi
          }

          # Crypto sync every 10 minutes (this workflow schedule)
          refresh "Crypto" "https://www.tradivex.com/api/crypto/sync"

          # Stocks sync every 10 minutes (using simple check)
          minute=$(date +%M)
          if [ $((minute % 10)) -eq 0 ]; then
            refresh "Stocks" "https://www.tradivex.com/api/stocks/sync"
          else
            echo "Skipping Stocks sync (only runs every 10 minutes)"
          fi

          refresh "Historical stocks" "https://www.tradivex.com/api/stocks/historical?symbol=AAPL&timeframe=daily"

          if [ "$failures" -gt 0 ]; then
            echo "${failures} market cache refresh job(s) failed."
            exit 1
          fi
