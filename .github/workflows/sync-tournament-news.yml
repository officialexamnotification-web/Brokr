name: Sync tournament news

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate source-grounded news
        run: npm run sync:tournament-news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
      - name: Commit updated news
        run: |
          git config user.name "tradivex-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/generated-tournament-news.ts
          git diff --cached --quiet || git commit -m "Sync verified tournament news"
          git push
